<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Default SEO (overridden by react-helmet-async on each page) ── -->
    <title>Voyage India — Discover Land-Only Holiday Packages</title>
    <meta name="description" content="Browse, explore, and book transparent land-only international holiday packages for Indian travellers. Dynamic INR pricing, interactive itinerary maps, and secure Razorpay payments." />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- ── Default Open Graph (overridden per-page) ── -->
    <meta property="og:type"       content="website" />
    <meta property="og:site_name"  content="Voyage India" />
    <meta property="og:title"      content="Voyage India — Discover Land-Only Holiday Packages" />
    <meta property="og:description" content="Browse, explore, and book transparent land-only international holiday packages for Indian travellers." />
    <meta property="og:url"        content="https://voyageindia.in/" />
    <meta property="og:image"      content="https://voyageindia.in/og-default.png" />
    <meta property="og:locale"     content="en_IN" />

    <!-- ── Default Twitter Card ── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Voyage India — Discover Land-Only Holiday Packages" />
    <meta name="twitter:description" content="Browse, explore, and book transparent land-only holiday packages for Indian travellers." />
    <meta name="twitter:image"       content="https://voyageindia.in/og-default.png" />

    <!-- ── JSON-LD: Organization schema (helps Google Knowledge Panel) ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TravelAgency",
      "name": "Voyage India",
      "url": "https://voyageindia.in",
      "logo": "https://voyageindia.in/favicon.svg",
      "description": "Curated land-only holiday packages for Indian travellers with transparent pricing and interactive itinerary maps.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "IN"
      },
      "priceRange": "₹₹",
      "currenciesAccepted": "INR",
      "paymentAccepted": "Credit Card, Debit Card, UPI",
      "areaServed": "IN"
    }
    </script>

    <!-- ── Google Fonts ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Skip-to-main-content: WCAG 2.4.1 (Bypass Blocks, Level A)
         First focusable element — keyboard users press Tab to reveal it. -->
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
